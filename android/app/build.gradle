apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Version from package.json (docs/android.md). TERRA_ANDROID_BUILD (0-99) counts extra
// uploads of one app version: Google Play needs a higher versionCode for every upload.
def packageJson = new JsonSlurper().parse(file('../../package.json'))
def versionParts = packageJson.version.tokenize('.').collect { (it =~ /^\d+/)[0] as int }
def uploadNumber = (System.getenv('TERRA_ANDROID_BUILD') ?: '0') as int
if (uploadNumber < 0 || uploadNumber > 99) throw new GradleException('TERRA_ANDROID_BUILD must be 0-99')

// Release signing (the upload key): keystore.properties outside the repository, never committed.
def signingFile = file(System.getenv('TERRA_ANDROID_SIGNING') ?:
    "${System.getProperty('user.home')}/.terra-board-signing/keystore.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace = "terra.board.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // The Play Store identity: it can never change once the app is published.
        applicationId "com.socialartworks.terraboard"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionParts[0] * 1000000 + versionParts[1] * 10000 + versionParts[2] * 100 + uploadNumber
        versionName packageJson.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signing.storeFile) {
                storeFile file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (signing.storeFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'


// An unsigned release cannot be uploaded to Google Play; say why instead of building one.
gradle.taskGraph.whenReady { graph ->
    def release = graph.allTasks.any { it.name in ['bundleRelease', 'assembleRelease'] }
    if (release && !signing.storeFile)
        throw new GradleException("No upload key: ${signingFile} is missing (docs/android.md, Releasing).")
}
