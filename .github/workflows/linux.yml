# Builds Terra Board for Linux x64 (AppImage and .deb) on ubuntu-latest, runs
# the unit tests, uses both built packages end to end (scripts/app-smoke.mjs),
# then uploads the files as a workflow artifact. It never publishes a release:
# attaching these files to a GitHub release is a separate, manual step
# (docs/development.md).
#
# It builds on Linux because sharp and onnxruntime need their Linux binaries,
# which npm installs only on Linux.
name: Linux build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # onnxruntime-node's install script would fetch CUDA libraries on Linux;
      # background removal runs on the CPU.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.13'
          cache: npm

      # A display for the tests and the start-up checks that open Electron
      # windows, fonts for the scripts the PDF tests print, and FUSE 2, which
      # AppImages need to mount themselves.
      - name: Install system packages
        timeout-minutes: 15
        run: |
          # Skips rebuilding the man-page index after each install, which can take minutes.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth fonts-noto-core fonts-noto-cjk libfuse2t64

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox
      # uses; without this Electron exits before opening a window. Only this
      # build machine changes.
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The background-removal model (176 MB) the tests and the extension use.
      - name: Cache the background-removal model
        uses: actions/cache@v4
        with:
          path: assets/models/u2net.onnx
          key: u2net-${{ hashFiles('scripts/payloads.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: xvfb-run -a npm test

      - name: Build AppImage and .deb
        run: npm run installer:linux

      # From here on the machine is a stock Ubuntu 24.04 again, which blocks the
      # user namespaces Chromium's sandbox uses, as on people's desktops. The
      # AppImage's launcher then adds --no-sandbox; the .deb brings an AppArmor
      # profile instead.
      - name: Restore Ubuntu's sandbox restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true

      # Starts the built app with an empty library and checks it reached the
      # board: its own storage, SQLite and the renderer. XDG_DATA_HOME points the
      # installed copy at a throwaway folder instead of ~/.local/share.
      - name: Start the AppImage once
        run: |
          appimage=$(realpath release/linux/*.AppImage)
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          timeout 180 xvfb-run -a "$appimage" --smoke-test 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -F 'DESKTOP_SMOKE' "$RUNNER_TEMP/smoke.log"
          grep -F "\"dataDirectory\":\"$XDG_DATA_HOME/Terra Board/Library\"" "$RUNNER_TEMP/smoke.log"

      # Adds a board with a note and an image, closes the window, starts the
      # app again and checks they came back, installs Background removal and
      # Song links from the build and runs them, then connects over MCP the way
      # Claude Desktop does. The AppImage also has to add itself to the
      # applications menu.
      - name: Use the AppImage end to end
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-appimage"
          export TERRA_SMOKE_EXTENSIONS="$PWD/release/extensions"
          export TERRA_SMOKE_DESKTOP_ENTRY="$XDG_DATA_HOME/applications/terra-board.desktop"
          export TERRA_SMOKE_LIBRARY="$XDG_DATA_HOME/Terra Board/Library"
          export TERRA_SMOKE_SCREENSHOT="$RUNNER_TEMP/screens/appimage.png"
          timeout 300 xvfb-run -a node scripts/app-smoke.mjs "$(realpath release/linux/*.AppImage)"

      - name: Install the .deb and use it end to end
        run: |
          sudo apt-get install -y "$(realpath release/linux/*.deb)"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-deb"
          export TERRA_SMOKE_EXTENSIONS="$PWD/release/extensions"
          export TERRA_SMOKE_LIBRARY="$XDG_DATA_HOME/Terra Board/Library"
          export TERRA_SMOKE_SCREENSHOT="$RUNNER_TEMP/screens/deb.png"
          timeout 300 xvfb-run -a node scripts/app-smoke.mjs /usr/bin/terra-board

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-board-linux-screenshots
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/screens/*.png

      - name: Upload the Linux build
        uses: actions/upload-artifact@v4
        with:
          name: terra-board-linux-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            release/linux/*.AppImage
            release/linux/*.deb
            release/linux/latest-linux.yml
            release/extensions/onnxruntime-*-linux-x64-*.zip
