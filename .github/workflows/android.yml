# Builds the Android debug APK (docs/android.md) and uploads it as a workflow
# artifact. Manual runs only; it never signs for release, publishes to a store
# or creates a GitHub release.
name: Android build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The Android app needs neither Electron's binary nor the desktop extensions.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.13'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships the Android SDK (ANDROID_HOME); Gradle fetches
      # the platform and build tools the project asks for.

      - name: Install dependencies
        run: npm ci

      # The storage the Android app runs (electron/store.cjs on its shims).
      - name: Test Android storage
        run: node --test tests/android-store.test.mjs

      - name: Build the web app for Android
        run: npm run build:android

      - name: Build the debug APK
        run: node scripts/android-gradle.mjs assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: terra-board-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
